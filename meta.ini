nexusDescription="[b][size=6]General[/size][/b]\n<br />[size=3]- CBBE/CBBE 3BA/BHUNP\n<br />- BodySlide for COCO Body B you can find &gt;[url=http://www.nexusmods.com/skyrimspecialedition/mods/63090?tab=description]here[/url]&lt;\n<br />- Version for UUNP you can find &gt;[url=http://www.nexusmods.com/skyrimspecialedition/mods/64494]here[/url]&lt;\n<br />- Heavy armor\n<br />- Craftable and enchantable [color=#ff7700](important note about the crafting below)[/color][/size]\n<br />[size=3]- Fomod[/size]\n<br />\n<br />\n<br />[size=6][b]Features[/b][/size]\n<br />\n<br />[color=#00ff00][size=4][b] Zap sliders[/b][/size][/color]\n<br />[size=3]\n<br />- Zap sliders can be used in BodySlide to [color=#fff2cc]hide some parts of an outfit piece.[/color]\n<br />  For example: you only want armor on your left leg? Zap the right leg part away.\n<br />- Every outfit piece (except panty) contains zap sliders.\n<br />- There are also[color=#fff2cc] zap sliders for first person[/color].\n<br />- More info:[/size] [spoiler]\n<br />How to use?:\n<br />Open BodySlide, search for the desired armor piece and open the preview window. Now choose the parts you want to hide and click on build.\n<br />[img]http://i.imgur.com/u83j1S6.png[/img][img]http://i.imgur.com/isK4gUo.png[/img]﻿\n<br />[/spoiler]\n<br />\n<br />[color=#00ff00][size=4][b]Combined Armor[/b][/size][/color]\n<br />\n<br />[size=3]- The full armor set has 14 separate pieces. You can [color=#fff2cc]reduce the item count to 4[/color] pieces by [color=#fff2cc]combining them at a smithing forge[/color].\n<br />- More info:[/size] [spoiler]\n<br />Don't ask why I made a graphic lol\n<br />[img]http://i.imgur.com/XsNOZ5d.png[/img]\n<br />[/spoiler]\n<br />\n<br />[color=#00ff00][size=4][b]Metal and fabric colors[/b][/size][/color]\n<br />[size=3]\n<br />- In the fomod installer you can choose from [color=#fff2cc]9 different metal styles.[/color]\n<br />- For the [color=#fff2cc]fabric[/color] (panty and top) there are 4 colors for a non transparent version and 2 transparent versions. [color=#fff2cc]So 12 options in fact[/color].[/size]\n<br />\n<br />\n<br />[size=6][b]Crafting/Balance[/b][/size]\n<br />\n<br />[color=#00ff00][size=4][b]Crafting[/b][/size][/color]\n<br />\n<br />[size=3][color=#ff7700][b]- Important note![/b] - To craft/combine the armor at a smithing forge you need a special smithing hammer. [/color]\n<br /> [color=#fff2cc] Otherwise the set won't show up in the crafting list![/color] The idea is to keep your armor crafting list clean. For armor upgrades it is not needed.\n<br />  It can be found in the [color=#fff2cc]East Empire Company Warehouse[/color] at the Solitude docks. For the exact location [color=#fff2cc]check the \"Location\" section below[/color].\n<br />\n<br />- All outfit parts can be enchanted and upgraded (the panty can't be upgraded)[/size]\n<br />\n<br />[color=#00ff00][size=4][b]Balance[/b][/size][/color]\n<br />\n<br />[size=3]- In the fomod installer you can choose from [color=#fff2cc]2 categories for the esp[/color]: Balance or default.\n<br />- default: the armor gets pretty [color=#fff2cc]overpowerd at the time you upgrade[/color] it (this is due to how Skyrim handles the upgrading bonuses).\n<br />- balanced:[color=#fff2cc] only  breastplate, sabatons and gloves can be upgraded[/color]. The other parts still have a little bit of armor rating but cant' be\n<br />  upgraded  (it was the only and cleanest way I could think of to balance it for the smithing perks). \n<br />\n<br />- If you wonder why, here is the explanation: (unimportant for the mod) [/size] [spoiler]\n<br />If you upgrade an armor to legendary there is a multiplier for the armor rating but also a added bonus. For cuirass it's 20 and for every other part it's 10.\n<br />So with 11 pieces (including cuirass) the set gets a bonus of 120 armor rating. A vanilla set (4 pieces) gets 50.\n<br />Additionally the multipliers get nerfed on higher base ratings. \n<br />A part with an ebony material keyword and 1 armor rating has 14 armor on legendary when the player has a heavy armor skill of 15 without perks (In game it has 2 armor, a ~ 1.8 multiplier and a + 10 bonus).\n<br />A daedric part with 20 armor has 32 on legendary (should have a 2.0 multiplier but has in fact a + 10 bonus and a 1.1 multiplier). \n<br />Daedric cuirass with 52 has 77 when legendary (also 1.1 multiplier but 20 cuirass bonus)\n<br />Result: daedric gloves, boots and cuirass started at 92 armor and has 141 total on legendary quality.\n<br />My set with 11 pieces started at 22 armor and has 164 total on legendary quality.\n<br />\n<br />Long story short: Since my set has so many pieces there is no way to balance it for early, mid and endgame.\n<br />So my solution and why I made the balance esp as it is (only the 3 main parts can be tempered) should make a bit more sense now.\n<br />I personally recommend the default esp since on legendary quality and a good heavy armor skill you will reach the damage reduction cap with any vanilla armor anyway.\n<br />The balance esp is good for you if you want more consistent values.\n<br />Of course you always can play around with the ratings in the esp yourself and change it to your personal likings.\n<br />[/spoiler]\n<br />\n<br />[size=6][b]Location[/b][/size]\n<br />\n<br />[color=#00ff00][size=4][b]Armor[/b][/size][/color]\n<br />\n<br />[size=3]- Gloomreach Cavern under water[/size] [spoiler]\n<br />[img]http://i.imgur.com/XM20PMO.jpg[/img]\n<br />[img]http://i.imgur.com/CoZE6QK.jpg[/img]\n<br />[color=#ffff00]Progress through the cavern until you reach Gloomreach Hive[/color]\n<br />[img]http://i.imgur.com/nbtqvSd.jpg[/img]\n<br />[img]http://i.imgur.com/u7h7oxZ.jpg[/img]\n<br />[/spoiler]\n<br />\n<br />[color=#00ff00][size=4][b]Crafting hammer[/b][/size][/color]\n<br />\n<br />[size=3]- In the East Empire Company Warehouse (Solitude docks). Next to the cheese wheels[/size] [spoiler]\n<br />[img]http://i.imgur.com/cA6gowI.jpg[/img]\n<br />[img]http://i.imgur.com/WTyEzRM.jpg[/img]\n<br />[img]http://i.imgur.com/PJh6V1p.jpg[/img]\n<br />[img]http://i.imgur.com/tL7OxbX.jpg[/img]\n<br />[img]http://i.imgur.com/Dk7wkOW.jpg[/img]\n<br />[img]http://i.imgur.com/w63r4eF.jpg[/img]\n<br />[/spoiler]\n<br />\n<br />\n<br />[size=6][b]Update Plans[/b][/size]  \n<br />\n<br />[color=#00ff00][size=4][b][s]BHUNP[/s][/b][/size][/color]\n<br />\n<br />[size=3][s]I definately want to add a BHUNP version aswell. \n<br />It could take some time tho. But if anyone want to make a conversion and upload it I would really welcome it too.[/s][/size]\n<br />\n<br />[b][color=#00ff00][size=4][s]2K Textures[/s][/size][/color][/b]\n<br />[size=3][s](general optimization too)[/s]\n<br />\n<br />[/size][color=#00ff00][size=4][b]Optimized Boneweights[/b][/size][/color]\n<br />\n<br />\n<br />[size=6][b]Credits\n<br />[/b][/size]\n<br />[color=#00ff00][size=4][b]Many thanks to[/b][/size][/color]\n<br />\n<br />[size=3]- [/size][url=http://www.nexusmods.com/skyrimspecialedition/users/2546964]fadingsignal[/url][size=3] for giving me permission to use his [/size][url=http://www.nexusmods.com/skyrimspecialedition/mods/58817]cubemaps[/url]\n<br />[size=3]- [/size][url=http://www.nexusmods.com/skyrimspecialedition/users/4291759]ousnius[/url][size=3] and [/size][url=http://www.nexusmods.com/skyrim/users/3330686]caliente[/url][size=3] for [/size][url=http://www.nexusmods.com/skyrimspecialedition/mods/198]CBBE[/url][size=3] and [/size][url=http://www.nexusmods.com/skyrimspecialedition/mods/201]Bodyslide and Outfit Studio[/url]\n<br />[size=3]- [/size][url=http://www.nexusmods.com/skyrimspecialedition/users/14635849]Acro748[/url][size=3] for [/size][url=http://www.nexusmods.com/skyrimspecialedition/mods/30174]CBBE 3BA (3BBB)[/url]\n<br />[size=3]- [/size][url=http://www.nexusmods.com/skyrimspecialedition/users/3060962]Excellentium[/url][size=3] for the name :p[/size]\n<br />\n<br />\n<br />\n<br />[size=5]If you want to support my work[/size]\n<br />[url=http://buymeacoffee.com/goampuja][img]https://i.imgur.com/isKBcWX.png[/img][/url]"
