name: Build and Test SlideSmith

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Restore, build, test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            global.json

      - name: Restore
        run: dotnet restore BodyslideConverter.slnx

      - name: Build
        run: dotnet build BodyslideConverter.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/Bodyslide.Core.Tests/Bodyslide.Core.Tests.csproj --configuration Release --no-build

      - name: Build standalone Linux executable package
        run: dotnet publish src/Bodyslide.Standalone/Bodyslide.Standalone.csproj --configuration Release --runtime linux-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true --output artifacts/linux-x64
      - name: Write Linux quick-start note
        run: |
          cat <<'EOF' > artifacts/linux-x64/README-FIRST.txt
          SlideSmith Linux artifact

          Start:
            chmod +x SlideSmith
            ./SlideSmith --help
            ./SlideSmith --input "<armor path|folder|archive>" --target "CBBE" --output "<output directory>"

          Notes:
          - The executable is SlideSmith.
          - Extra files in this folder are runtime support files generated by .NET publish and should stay next to the executable.
          EOF

      - name: Zip standalone app
        run: |
          cd artifacts
          zip -r slidesmith-linux-x64-release.zip linux-x64

      - name: Upload standalone zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: slidesmith-linux-x64-release-zip
          path: artifacts/slidesmith-linux-x64-release.zip

  package-windows-on-merge:
    name: Package Windows app on merge branch
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: windows-latest
    needs: verify

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            global.json

      - name: Restore
        run: dotnet restore BodyslideConverter.slnx

      - name: Build Windows desktop executable package
        run: dotnet publish src/Bodyslide.Desktop/Bodyslide.Desktop.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true --output artifacts/win-x64
      - name: Write Windows quick-start note
        run: |
          @"
          SlideSmith Windows artifact

          Start:
          - Run SlideSmith.exe to open the desktop app.
          - Or run from terminal:
            .\SlideSmith.exe --help
            .\SlideSmith.exe --input "<armor path|folder|archive>" --target "CBBE" --output "<output directory>"

          Notes:
          - Extra files in this folder are runtime support files generated by .NET publish and should stay next to the executable.
          "@ | Set-Content -Path artifacts/win-x64/README-FIRST.txt

      - name: Zip Windows app
        run: Compress-Archive -Path artifacts/win-x64/* -DestinationPath artifacts/slidesmith-win-x64-release.zip

      - name: Upload Windows zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: slidesmith-win-x64-release-zip
          path: artifacts/slidesmith-win-x64-release.zip

  package-windows-on-pr:
    name: Package Windows app on pull request
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    needs: verify

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            global.json

      - name: Restore
        run: dotnet restore BodyslideConverter.slnx

      - name: Build Windows desktop executable package
        run: dotnet publish src/Bodyslide.Desktop/Bodyslide.Desktop.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true --output artifacts/win-x64
      - name: Write Windows quick-start note
        run: |
          @"
          SlideSmith Windows artifact

          Start:
          - Run SlideSmith.exe to open the desktop app.
          - Or run from terminal:
            .\SlideSmith.exe --help
            .\SlideSmith.exe --input "<armor path|folder|archive>" --target "CBBE" --output "<output directory>"

          Notes:
          - Extra files in this folder are runtime support files generated by .NET publish and should stay next to the executable.
          "@ | Set-Content -Path artifacts/win-x64/README-FIRST.txt

      - name: Zip Windows app
        run: Compress-Archive -Path artifacts/win-x64/* -DestinationPath artifacts/slidesmith-win-x64-pr-${{ github.event.pull_request.number }}.zip

      - name: Upload Windows zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: slidesmith-win-x64-pr-${{ github.event.pull_request.number }}-zip
          path: artifacts/slidesmith-win-x64-pr-${{ github.event.pull_request.number }}.zip
