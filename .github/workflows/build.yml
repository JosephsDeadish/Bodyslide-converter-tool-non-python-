name: Build and Test

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build standalone app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            global.json

      - name: Restore
        run: dotnet restore BodyslideConverter.slnx

      - name: Build
        run: dotnet build BodyslideConverter.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/Bodyslide.Core.Tests/Bodyslide.Core.Tests.csproj --configuration Release --no-build

      - name: Publish standalone app
        run: dotnet publish src/Bodyslide.Standalone/Bodyslide.Standalone.csproj --configuration Release --no-build --output artifacts/standalone

      - name: Upload standalone artifact
        uses: actions/upload-artifact@v4
        with:
          name: bodyslide-standalone-release
          path: artifacts/standalone
