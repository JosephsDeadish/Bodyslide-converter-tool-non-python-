name: Build and Test SlideSmith

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Restore, build, test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            global.json

      - name: Restore
        run: dotnet restore BodyslideConverter.slnx

      - name: Build
        run: dotnet build BodyslideConverter.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/Bodyslide.Core.Tests/Bodyslide.Core.Tests.csproj --configuration Release --no-build

      - name: Publish standalone Linux CLI (single file)
        run: >
          dotnet publish src/Bodyslide.Standalone/Bodyslide.Standalone.csproj
          --configuration Release
          --runtime linux-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -p:DebugSymbols=false
          --output artifacts/linux-x64

      - name: Smoke-test packaged Linux CLI
        run: |
          chmod +x artifacts/linux-x64/SlideSmith
          artifacts/linux-x64/SlideSmith --self-check

      - name: Zip Linux CLI (single binary)
        run: |
          cd artifacts/linux-x64
          zip ../slidesmith-linux-x64.zip SlideSmith

      - name: Verify Linux CLI zip contents
        run: unzip -l artifacts/slidesmith-linux-x64.zip SlideSmith

      - name: Upload Linux CLI zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: slidesmith-linux-x64
          path: artifacts/slidesmith-linux-x64.zip

  package-windows-on-merge:
    name: Package Windows app on merge — create rolling release
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: windows-latest
    needs: verify
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            global.json

      - name: Restore
        run: dotnet restore BodyslideConverter.slnx

      - name: Download Linux CLI zip artifact from verify job
        uses: actions/download-artifact@v4
        with:
          name: slidesmith-linux-x64
          path: artifacts

      - name: Publish Windows desktop app (single file)
        run: >
          dotnet publish src/Bodyslide.Desktop/Bodyslide.Desktop.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -p:DebugSymbols=false
          --output artifacts/win-x64

      - name: Publish Windows standalone CLI (single file)
        run: >
          dotnet publish src/Bodyslide.Standalone/Bodyslide.Standalone.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -p:DebugSymbols=false
          --output artifacts/win-x64-cli

      - name: Rename CLI exe to avoid collision
        run: Rename-Item artifacts/win-x64-cli/SlideSmith.exe SlideSmith-CLI.exe

      - name: Smoke-test packaged Windows binaries
        shell: pwsh
        run: |
          & artifacts/win-x64/SlideSmith.exe --smoke-test
          & artifacts/win-x64-cli/SlideSmith-CLI.exe --self-check

      - name: Stage Windows bundle contents
        shell: pwsh
        run: |
          $bundleRoot = "artifacts/win-bundle"
          $desktopBundle = Join-Path $bundleRoot "desktop"
          $cliBundle = Join-Path $bundleRoot "cli"
          $metaBundle = Join-Path $bundleRoot "meta"
          Remove-Item $bundleRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $desktopBundle -Force | Out-Null
          New-Item -ItemType Directory -Path $cliBundle -Force | Out-Null
          New-Item -ItemType Directory -Path $metaBundle -Force | Out-Null
          Copy-Item artifacts/win-x64/* $desktopBundle -Recurse -Force
          Copy-Item artifacts/win-x64-cli/* $cliBundle -Recurse -Force
          Copy-Item packaging/windows-bundle/* $bundleRoot -Recurse -Force
          Copy-Item README.md (Join-Path $bundleRoot "README.md") -Force
          $bundleMetadata = [ordered]@{
            desktop = "desktop/SlideSmith.exe"
            cli = "cli/SlideSmith-CLI.exe"
            readme = "README.md"
            fomodModuleConfig = "fomod/ModuleConfig.xml"
            fomodInfo = "fomod/info.xml"
            modOrganizerMetadata = "meta.ini"
            sourceDesktopPublish = "artifacts/win-x64"
            sourceCliPublish = "artifacts/win-x64-cli"
          } | ConvertTo-Json
          Set-Content -Path (Join-Path $metaBundle "slidesmith-bundle.json") -Value $bundleMetadata -Encoding UTF8

      - name: Create Windows bundle zip (desktop + CLI)
        run: Compress-Archive -Path artifacts/win-bundle/* -DestinationPath artifacts/slidesmith-win-x64-bundle.zip

      - name: Verify Windows bundle zip contents
        shell: pwsh
        run: |
          $extractPath = Join-Path $env:RUNNER_TEMP "slidesmith-win-x64-bundle-check"
          if (Test-Path $extractPath) {
            Remove-Item $extractPath -Recurse -Force
          }
          Expand-Archive artifacts/slidesmith-win-x64-bundle.zip -DestinationPath $extractPath
          if (!(Test-Path (Join-Path $extractPath "desktop/SlideSmith.exe"))) {
            throw "Missing desktop/SlideSmith.exe in bundle zip."
          }
          if (!(Test-Path (Join-Path $extractPath "cli/SlideSmith-CLI.exe"))) {
            throw "Missing cli/SlideSmith-CLI.exe in bundle zip."
          }
          if (!(Test-Path (Join-Path $extractPath "README.md"))) {
            throw "Missing README.md in bundle zip."
          }
          if (!(Test-Path (Join-Path $extractPath "meta/slidesmith-bundle.json"))) {
            throw "Missing meta/slidesmith-bundle.json in bundle zip."
          }

      - name: Upload Windows app zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: slidesmith-win-x64-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/slidesmith-win-x64-bundle.zip

      - name: Create or update rolling "latest" GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "SlideSmith — latest build"
          prerelease: true
          generate_release_notes: false
          body: |
            **Automatically updated on every push to main.**

            | File | Description |
            |---|---|
            | `SlideSmith.exe` | Windows desktop GUI (drag-and-drop armor, no terminal needed) |
            | `SlideSmith-CLI.exe` | Windows command-line tool |
            | `slidesmith-win-x64-bundle.zip` | Windows bundle with `desktop/SlideSmith.exe`, `cli/SlideSmith-CLI.exe`, `README.md`, and `meta/slidesmith-bundle.json` |
            | `slidesmith-linux-x64.zip` | Linux CLI binary |

            **Quick start (desktop):** download `SlideSmith.exe`, double-click it.
            **Quick start (CLI):** `.\SlideSmith-CLI.exe --input "path\to\armor.nif" --target CBBE --output "C:\output"`
            Run `.\SlideSmith-CLI.exe --help` for all options.
          files: |
            artifacts/win-x64/SlideSmith.exe
            artifacts/win-x64-cli/SlideSmith-CLI.exe
            artifacts/slidesmith-win-x64-bundle.zip
            artifacts/slidesmith-linux-x64.zip

  package-windows-artifact:
    name: Package Windows app artifact (PR/branch push/manual)
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
      github.ref != 'refs/heads/main' &&
      github.ref != 'refs/heads/master')
    runs-on: windows-latest
    needs: verify

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            global.json

      - name: Restore
        run: dotnet restore BodyslideConverter.slnx

      - name: Publish Windows desktop app (single file)
        run: >
          dotnet publish src/Bodyslide.Desktop/Bodyslide.Desktop.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -p:DebugSymbols=false
          --output artifacts/win-x64

      - name: Publish Windows standalone CLI (single file)
        run: >
          dotnet publish src/Bodyslide.Standalone/Bodyslide.Standalone.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -p:DebugSymbols=false
          --output artifacts/win-x64-cli

      - name: Rename CLI exe to avoid collision
        run: Rename-Item artifacts/win-x64-cli/SlideSmith.exe SlideSmith-CLI.exe

      - name: Smoke-test packaged Windows binaries
        shell: pwsh
        run: |
          & artifacts/win-x64/SlideSmith.exe --smoke-test
          & artifacts/win-x64-cli/SlideSmith-CLI.exe --self-check

      - name: Stage Windows bundle contents
        shell: pwsh
        run: |
          $bundleRoot = "artifacts/win-bundle"
          $desktopBundle = Join-Path $bundleRoot "desktop"
          $cliBundle = Join-Path $bundleRoot "cli"
          $metaBundle = Join-Path $bundleRoot "meta"
          Remove-Item $bundleRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $desktopBundle -Force | Out-Null
          New-Item -ItemType Directory -Path $cliBundle -Force | Out-Null
          New-Item -ItemType Directory -Path $metaBundle -Force | Out-Null
          Copy-Item artifacts/win-x64/* $desktopBundle -Recurse -Force
          Copy-Item artifacts/win-x64-cli/* $cliBundle -Recurse -Force
          Copy-Item README.md (Join-Path $bundleRoot "README.md") -Force
          $bundleMetadata = [ordered]@{
            desktop = "desktop/SlideSmith.exe"
            cli = "cli/SlideSmith-CLI.exe"
            readme = "README.md"
            sourceDesktopPublish = "artifacts/win-x64"
            sourceCliPublish = "artifacts/win-x64-cli"
          } | ConvertTo-Json
          Set-Content -Path (Join-Path $metaBundle "slidesmith-bundle.json") -Value $bundleMetadata -Encoding UTF8

      - name: Zip Windows bundle (desktop + CLI)
        run: Compress-Archive -Path artifacts/win-bundle/* -DestinationPath artifacts/slidesmith-win-x64-bundle.zip

      - name: Verify Windows bundle zip contents
        shell: pwsh
        run: |
          $extractPath = Join-Path $env:RUNNER_TEMP "slidesmith-win-x64-bundle-check"
          if (Test-Path $extractPath) {
            Remove-Item $extractPath -Recurse -Force
          }
          Expand-Archive artifacts/slidesmith-win-x64-bundle.zip -DestinationPath $extractPath
          if (!(Test-Path (Join-Path $extractPath "desktop/SlideSmith.exe"))) {
            throw "Missing desktop/SlideSmith.exe in bundle zip."
          }
          if (!(Test-Path (Join-Path $extractPath "cli/SlideSmith-CLI.exe"))) {
            throw "Missing cli/SlideSmith-CLI.exe in bundle zip."
          }
          if (!(Test-Path (Join-Path $extractPath "README.md"))) {
            throw "Missing README.md in bundle zip."
          }
          if (!(Test-Path (Join-Path $extractPath "meta/slidesmith-bundle.json"))) {
            throw "Missing meta/slidesmith-bundle.json in bundle zip."
          }
          if (!(Test-Path (Join-Path $extractPath "fomod/ModuleConfig.xml"))) {
            throw "Missing fomod/ModuleConfig.xml in bundle zip."
          }
          if (!(Test-Path (Join-Path $extractPath "fomod/info.xml"))) {
            throw "Missing fomod/info.xml in bundle zip."
          }
          if (!(Test-Path (Join-Path $extractPath "meta.ini"))) {
            throw "Missing meta.ini in bundle zip."
          }

          $moduleConfig = Get-Content (Join-Path $extractPath "fomod/ModuleConfig.xml") -Raw
          foreach ($requiredEntry in @('source="desktop"', 'source="cli"', 'source="meta"', 'source="README.md"', 'source="meta.ini"')) {
            if ($moduleConfig -notmatch [regex]::Escape($requiredEntry)) {
              throw "Bundle FOMOD metadata is missing installer entry $requiredEntry."
            }
          }

      - name: Set Windows artifact name
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'pull_request') {
            "WINDOWS_ARTIFACT_NAME=slidesmith-win-x64-pr-${{ github.event.pull_request.number }}" >> $env:GITHUB_ENV
          } else {
            "WINDOWS_ARTIFACT_NAME=slidesmith-win-x64-run-${{ github.run_id }}-${{ github.run_attempt }}" >> $env:GITHUB_ENV
          }

      - name: Upload Windows app zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.WINDOWS_ARTIFACT_NAME }}
          path: artifacts/slidesmith-win-x64-bundle.zip
