name: Release SlideSmith

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish GitHub Release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            global.json

      - name: Restore
        run: dotnet restore BodyslideConverter.slnx

      - name: Publish Windows desktop app (single file)
        run: >
          dotnet publish src/Bodyslide.Desktop/Bodyslide.Desktop.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -p:DebugSymbols=false
          --output artifacts/win-x64

      - name: Publish Windows mod-manager desktop (no self-extraction)
        run: >
          dotnet publish src/Bodyslide.Desktop/Bodyslide.Desktop.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=false
          -p:DebugType=none
          -p:DebugSymbols=false
          --output artifacts/win-x64-manager

      - name: Publish Windows standalone CLI (single file)
        run: >
          dotnet publish src/Bodyslide.Standalone/Bodyslide.Standalone.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -p:DebugSymbols=false
          --output artifacts/win-x64-cli

      - name: Rename CLI exe
        run: Rename-Item artifacts/win-x64-cli/SlideSmith.exe SlideSmith-CLI.exe

      - name: Stage Windows bundle contents
        shell: pwsh
        run: |
          $bundleRoot = "artifacts/win-bundle"
          $desktopBundle = Join-Path $bundleRoot "desktop"
          $cliBundle = Join-Path $bundleRoot "cli"
          $metaBundle = Join-Path $bundleRoot "meta"
          Remove-Item $bundleRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $desktopBundle -Force | Out-Null
          New-Item -ItemType Directory -Path $cliBundle -Force | Out-Null
          New-Item -ItemType Directory -Path $metaBundle -Force | Out-Null
          Copy-Item artifacts/win-x64-manager/* $desktopBundle -Recurse -Force
          Copy-Item artifacts/win-x64-cli/* $cliBundle -Recurse -Force
          Copy-Item packaging/windows-bundle/* $bundleRoot -Recurse -Force
          $bundleMetadata = [ordered]@{
            desktop = "desktop/SlideSmith.exe"
            cli = "cli/SlideSmith-CLI.exe"
            readme = "README.txt"
            fomodModuleConfig = "fomod/ModuleConfig.xml"
            fomodInfo = "fomod/info.xml"
            modOrganizerMetadata = "meta.ini"
            sourceDesktopPublish = "artifacts/win-x64-manager"
            sourceCliPublish = "artifacts/win-x64-cli"
          } | ConvertTo-Json
          Set-Content -Path (Join-Path $metaBundle "slidesmith-bundle.json") -Value $bundleMetadata -Encoding UTF8

      - name: Create Windows bundle zip (desktop + CLI)
        run: Compress-Archive -Path artifacts/win-bundle/* -DestinationPath artifacts/slidesmith-win-x64-bundle.zip

      - name: Verify Windows bundle zip contents
        shell: pwsh
        run: |
          $extractPath = Join-Path $env:RUNNER_TEMP "slidesmith-win-x64-bundle-check"
          if (Test-Path $extractPath) {
            Remove-Item $extractPath -Recurse -Force
          }
          Expand-Archive artifacts/slidesmith-win-x64-bundle.zip -DestinationPath $extractPath
          if (!(Test-Path (Join-Path $extractPath "desktop/SlideSmith.exe"))) {
            throw "Missing desktop/SlideSmith.exe in bundle zip."
          }
          if (!(Test-Path (Join-Path $extractPath "cli/SlideSmith-CLI.exe"))) {
            throw "Missing cli/SlideSmith-CLI.exe in bundle zip."
          }
          if (!(Test-Path (Join-Path $extractPath "README.txt"))) {
            throw "Missing README.txt in bundle zip."
          }
          if (!(Test-Path (Join-Path $extractPath "meta/slidesmith-bundle.json"))) {
            throw "Missing meta/slidesmith-bundle.json in bundle zip."
          }
          if (!(Test-Path (Join-Path $extractPath "fomod/ModuleConfig.xml"))) {
            throw "Missing fomod/ModuleConfig.xml in bundle zip."
          }
          if (!(Test-Path (Join-Path $extractPath "fomod/info.xml"))) {
            throw "Missing fomod/info.xml in bundle zip."
          }
          if (!(Test-Path (Join-Path $extractPath "meta.ini"))) {
            throw "Missing meta.ini in bundle zip."
          }

          [xml]$moduleConfig = Get-Content (Join-Path $extractPath "fomod/ModuleConfig.xml") -Raw
          $requiredMappings = @(
            'folder[@source="desktop" and @destination="CalienteTools/SlideSmith"]',
            'folder[@source="cli" and @destination="CalienteTools/SlideSmith/cli"]',
            'folder[@source="meta" and @destination="CalienteTools/SlideSmith/meta"]',
            'file[@source="cli/SlideSmith-CLI.exe" and @destination="CalienteTools/SlideSmith/SlideSmith-CLI.exe"]',
            'file[@source="README.txt" and @destination="CalienteTools/SlideSmith/README.txt"]',
            'file[@source="meta.ini" and @destination="CalienteTools/SlideSmith/meta.ini"]'
          )
          foreach ($mapping in $requiredMappings) {
            if (!$moduleConfig.SelectSingleNode("/config/requiredInstallFiles/$mapping")) {
              throw "Bundle FOMOD metadata is missing installer mapping $mapping."
            }
          }
          $installPath = Join-Path $extractPath "installed/CalienteTools/SlideSmith"
          New-Item -ItemType Directory -Path $installPath -Force | Out-Null
          Copy-Item (Join-Path $extractPath "desktop/*") $installPath -Recurse -Force
          foreach ($dependency in @("SlideSmith.dll", "SlideSmith.runtimeconfig.json", "hostfxr.dll", "coreclr.dll")) {
            if (!(Test-Path (Join-Path $installPath $dependency))) {
              throw "Missing desktop dependency $dependency in installed bundle."
            }
          }
          $desktopProcess = Start-Process -FilePath (Join-Path $installPath "SlideSmith.exe") -WorkingDirectory $installPath -ArgumentList '--smoke-test' -Wait -PassThru
          if ($desktopProcess.ExitCode -ne 0) {
            throw "Installed Windows bundle desktop smoke test failed with exit code $($desktopProcess.ExitCode)."
          }
          & (Join-Path $extractPath "cli/SlideSmith-CLI.exe") --self-check
          if ($LASTEXITCODE -ne 0) {
            throw "Packaged Windows CLI self-check failed with exit code $LASTEXITCODE."
          }

      - name: Create GitHub Release and upload executables
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/win-x64/SlideSmith.exe
            artifacts/win-x64-cli/SlideSmith-CLI.exe
            artifacts/slidesmith-win-x64-bundle.zip
