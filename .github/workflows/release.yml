name: Release SlideSmith

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish GitHub Release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            global.json

      - name: Restore
        run: dotnet restore BodyslideConverter.slnx

      - name: Publish Windows desktop app (single file)
        run: >
          dotnet publish src/Bodyslide.Desktop/Bodyslide.Desktop.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -p:DebugSymbols=false
          --output artifacts/win-x64

      - name: Publish Windows standalone CLI (single file)
        run: >
          dotnet publish src/Bodyslide.Standalone/Bodyslide.Standalone.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -p:DebugSymbols=false
          --output artifacts/win-x64-cli

      - name: Rename CLI exe
        run: Rename-Item artifacts/win-x64-cli/SlideSmith.exe SlideSmith-CLI.exe

      - name: Create Windows bundle zip (desktop + CLI)
        run: Compress-Archive -Path artifacts/win-x64/SlideSmith.exe,artifacts/win-x64-cli/SlideSmith-CLI.exe -DestinationPath artifacts/slidesmith-win-x64-bundle.zip

      - name: Create GitHub Release and upload executables
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/win-x64/SlideSmith.exe
            artifacts/win-x64-cli/SlideSmith-CLI.exe
            artifacts/slidesmith-win-x64-bundle.zip
